<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/haven-logo.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/haven-logo.png" />
    <link rel="apple-touch-icon" href="/haven-logo.png" />
    <title>The Hub — Developer Retreats</title>

    <!--
      Content Security Policy baseline.
      Tighten this in production via HTTP headers in vercel.json —
      the meta tag here is a fallback and development guide.
      'unsafe-inline' is needed for Vite HMR in dev; use a nonce in prod.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:3000;"
    />

    <!-- Fonts — preconnect first to reduce latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
